name: Python security checks

on:
  push:
    branches: [main, integration/production-supportpilot]
  pull_request:
    branches: [main, integration/production-supportpilot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Compile application
        run: python -m py_compile app.py bot.py
      - name: Verify repository contains no runtime database
        run: |
          if find . -type f \\( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \\) -print -quit | grep -q .; then
            echo 'Runtime database must not be committed.' >&2
            exit 1
          fi
