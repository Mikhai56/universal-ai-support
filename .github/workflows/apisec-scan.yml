name: Python security checks

on:
  push:
    branches: [main, integration/production-supportpilot]
  pull_request:
    branches: [main, integration/production-supportpilot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Compile application
        run: python -m py_compile app.py bot.py
      - name: Verify tracked files contain no runtime database
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              *.db|*.sqlite|*.sqlite3) printf '%s\n' "$file" ;;
            esac
          done)"
          if [ -n "$bad_files" ]; then
            printf 'Runtime database must not be committed:\n%s\n' "$bad_files" >&2
            exit 1
          fi
