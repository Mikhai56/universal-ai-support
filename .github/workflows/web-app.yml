name: Web app CI

on:
  push:
    branches: [main, integration/production-supportpilot]
  pull_request:
    branches: [main, integration/production-supportpilot]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Smoke test
        run: |
          python app.py > /tmp/supportpilot.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/api/health && exit 0; sleep 1; done
          cat /tmp/supportpilot.log
          exit 1
