name: Web app CI

on:
  push:
    branches: [main, feature/full-app]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test
        run: |
          python app.py > /tmp/supportpilot.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/api/health && exit 0; sleep 1; done
          cat /tmp/supportpilot.log
          exit 1
