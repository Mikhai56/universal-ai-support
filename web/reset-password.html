<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupportPilot — восстановление пароля</title><style>body{font-family:system-ui;background:#f6f8fb;margin:0}.box{max-width:520px;margin:8vh auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 40px #0001}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 14px;border:1px solid #cbd5e1;border-radius:9px}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#111827;color:#fff;font-weight:700}.msg{min-height:24px;margin:10px 0}.err{color:#b91c1c}.ok{color:#166534}a{color:#2563eb}</style></head><body><main class="box"><h1 id="title">Восстановление пароля</h1><div id="msg" class="msg"></div><section id="request"><p>Введите email владельца или участника кабинета.</p><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><button class="btn" onclick="requestReset()">Отправить ссылку</button></section><section id="confirm" hidden><p>Введите новый пароль: минимум 12 символов, заглавная, строчная и цифра.</p><input id="password" type="password" autocomplete="new-password"><button class="btn" onclick="confirmReset()">Сохранить новый пароль</button></section><p><a href="/client">Вернуться ко входу</a></p></main><script>const token=new URLSearchParams(location.search).get('token');if(token){request.hidden=true;confirm.hidden=false;title.textContent='Новый пароль'}async function requestReset(){msg.className='msg';try{const r=await fetch('/api/commercial/password-reset/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});const d=await r.json();msg.textContent=d.message||'Проверьте email.';msg.className='msg ok'}catch(e){msg.textContent='Не удалось отправить запрос';msg.className='msg err'}}async function confirmReset(){msg.className='msg';try{const r=await fetch('/api/commercial/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');msg.textContent='Пароль изменён. Теперь можно войти.';msg.className='msg ok';confirm.hidden=true}catch(e){msg.textContent=e.message;msg.className='msg err'}}</script></body></html>
