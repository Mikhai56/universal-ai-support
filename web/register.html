<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupportPilot — регистрация</title><style>body{font-family:system-ui;background:#f6f8fb;margin:0}.box{max-width:520px;margin:8vh auto;background:white;padding:28px;border-radius:18px;box-shadow:0 10px 40px #0001}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 14px;border:1px solid #cbd5e1;border-radius:9px}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#111827;color:white;font-weight:700}.switch{margin-top:18px;text-align:center}.error{color:#b91c1c;min-height:24px}</style></head><body><main class="box"><h1>Создание личного кабинета владельца</h1><p>Создайте личный кабинет владельца компании. 14 дней бесплатно, затем выберите тариф.</p><div id="err" class="error"></div><label>Название компании</label><input id="company" placeholder="Например, Acme"><label>Email владельца</label><input id="email" type="email" autocomplete="email"><label>Пароль</label><input id="password" type="password" autocomplete="new-password" placeholder="12+ символов, A-z и цифра"><button class="btn" onclick="submitForm()">Создать кабинет</button><div class="switch">Уже есть кабинет? <a href="/client">Войти</a><br><a href="/reset-password">Забыли пароль?</a></div></main><script>
async function submitForm(){
  err.textContent='';
  try{
    const r=await fetch('/api/commercial/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company:company.value,email:email.value,password:password.value})});
    const d=await r.json();
    if(!r.ok) throw Error(d.error||'Ошибка регистрации');
    sessionStorage.setItem('sp_registered','1'); location.href='/account';
  }catch(e){err.textContent=e.message}
}
</script></body></html>
