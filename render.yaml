services:
  - type: worker
    name: supportpilot-telegram
    runtime: python
    buildCommand: python3 -m py_compile bot.py
    startCommand: python3 bot.py
    maxShutdownDelaySeconds: 30
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: DB_PATH
        value: /var/data/supportpilot.db
      - key: KB_PATH
        value: /opt/render/project/src/knowledge_base.json
    disk:
      name: supportpilot-data
      mountPath: /var/data
      sizeGB: 5
